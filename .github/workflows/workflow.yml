name: DriversF2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '*/15 * * * 5-6'
    - cron: '*/5 * * * 0'
  workflow_dispatch:
    
jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Check Python
        run: |
          python3 --version
          which python3

      - name: Install dependencies
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt
          python3 -m playwright install

      - name: Run scraper
        run: python3 f2.py
